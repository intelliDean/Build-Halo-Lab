name: lab
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked --release
      - name: Existing official Ragu example
        run: cargo test --manifest-path vendor/ragu/Cargo.toml -p ragu_pcd --test nontrivial --locked --release --jobs 1 --features baked,ragu_circuits/insecure-test-registry-tag
      - run: cargo clippy --workspace --all-targets --locked --release -- -D warnings
      - run: cargo build --locked --release -p lab-cli
      - name: Acceptance validator regression tests
        run: python3 -m unittest discover -s tests -p test_acceptance.py -v
      - name: Separate-process acceptance and measurements
        run: python3 tests/acceptance.py --binary target/release/lab-cli --output evidence/generated
      - name: Assess worked lesson solution
        run: python3 tests/assessment.py --candidate lessons/ipa/solution.py --self-test
      - name: Retain measured evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-evidence
          path: evidence/generated
          if-no-files-found: warn
