[package]
name = "recursive-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
ragu_pcd = { path = "../../vendor/ragu/crates/ragu_pcd", features = ["baked", "multicore"] }
ragu_circuits = { path = "../../vendor/ragu/crates/ragu_circuits", features = ["insecure-test-registry-tag"] }
ragu_core = { path = "../../vendor/ragu/crates/ragu_core" }
ragu_primitives = { path = "../../vendor/ragu/crates/ragu_primitives" }
udon = { package = "zakura-udon", version = "=0.1.0", features = ["traits"] }
rand = { version = "=0.10.1", features = ["std_rng"] }
serde = { version = "=1.0.228", features = ["derive"] }
hex = "=0.4.3"
